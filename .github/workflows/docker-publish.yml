name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Once a week on Sunday at midnight

env:
  REGISTRY_GHCR: ghcr.io
  # DockerHub namespace/repo
  IMAGE_NAME_FRONTEND: teeks99/mws-frontend
  IMAGE_NAME_BACKEND: teeks99/mws-backend
  # GHCR namespace/repo (supports nested structure)
  GHCR_IMAGE_NAME_FRONTEND: ${{ github.repository }}/mws-frontend
  GHCR_IMAGE_NAME_BACKEND: ${{ github.repository }}/mws-backend

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Track the Dockerfile's base image so a Dependabot bump to it is exercised
      # here, at the version that will actually ship, before anything publishes.
      - name: Read Node version from the Dockerfile
        id: node
        run: |
          version=$(grep -oP '^FROM node:\K[0-9]+' Dockerfile)
          [ -n "$version" ] || { echo "::error::Could not read a Node version from frontend/Dockerfile"; exit 1; }
          echo "Verifying against Node $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs strictly from the lockfile, so this also catches
      # package.json and package-lock.json drifting apart.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read Python version from the Dockerfile
        id: python
        run: |
          version=$(grep -oP '^FROM python:\K[0-9]+\.[0-9]+' Dockerfile)
          [ -n "$version" ] || { echo "::error::Could not read a Python version from backend/Dockerfile"; exit 1; }
          echo "Verifying against Python $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A clean `pip install` says nothing about whether the app actually loads:
      # a bad import or syntax error still builds an image that crash-loops.
      - name: Import check
        run: python -c "import app.main"

      - name: Smoke test the API
        shell: bash
        env:
          REDIS_URL: redis://localhost:6379/0
          ADMIN_API_KEY: ci-smoke-test-key
          NWS_USER_AGENT: "MyWeatherService-CI/1.0 (ci@example.com)"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &

          ready=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::API never became ready"; cat /tmp/uvicorn.log; exit 1
          fi

          curl -sf http://127.0.0.1:8000/ | grep -q "My Weather Service"

          # A location with nothing cached must answer 404, not 500. Returning an
          # error dict from an endpoint with a response_model fails validation and
          # surfaces as an unparseable 500.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/forecast/nws/no-such-location)
          [ "$code" = "404" ] || { echo "::error::expected 404 for an uncached forecast, got $code"; exit 1; }

          curl -sf http://127.0.0.1:8000/api/locations/ | python -c "import json,sys; assert isinstance(json.load(sys.stdin), list)"
          curl -sf http://127.0.0.1:8000/openapi.json > /dev/null

  build-and-push:
    needs: [verify-frontend, verify-backend]
    # Pull requests get verified above, but only main publishes images.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Login to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Login to GitHub Container Registry
      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate tags based on git commit SHA
      - name: Extract version
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # --- FRONTEND ---
      - name: Extract Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME_FRONTEND }}
            ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE_NAME_FRONTEND }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.sha_short }}
            type=sha

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- BACKEND ---
      - name: Extract Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME_BACKEND }}
            ${{ env.REGISTRY_GHCR }}/${{ env.GHCR_IMAGE_NAME_BACKEND }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.sha_short }}
            type=sha

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
